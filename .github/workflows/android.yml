name: Android CI

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Retrieve version name
      run: echo VERSION_NAME=$(grep "versionName" app/build.gradle | sed -E 's/.*versionName "([^"]+)".*/\1/') >> $GITHUB_ENV

    - name: Retrieve version code
      run: echo VERSION_CODE=$(cat ${{ github.workspace }}/app/build.gradle | grep "versionCode" | grep -Eo "[0-9]+") >> $GITHUB_ENV

    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Setup build tool version variable
      shell: bash
      run: |
        BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
        echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
        echo Last build tool version is: $BUILD_TOOL_VERSION

    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: ${{ github.workspace }}/app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNINGKEYBASE64 }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTOREPASSWORD }}
        keyPassword: ${{ secrets.KEYPASSWORD }}
      env:
        BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

    - name: Rename APK
      run: mv ${{ github.workspace }}/app/build/outputs/apk/release/app-release-unsigned-signed.apk ${{ github.workspace }}/app/build/outputs/apk/release/fcmfix-oneplus15-coloros16-${{ env.VERSION_NAME }}.apk
    
    - name: Upload built apk
      uses: actions/upload-artifact@v4
      with:
        name: release
        path: ${{ github.workspace }}/app/build/outputs/apk/release/fcmfix-oneplus15-coloros16-${{ env.VERSION_NAME }}.apk

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        name: "FCMFix OnePlus 15 ColorOS 16 (${{ env.VERSION_NAME }})"
        tag_name: ${{ env.VERSION_NAME }}
        token: "${{ github.token }}"
        body: |
          本版本由仓库 CI 使用专用发布证书构建并签名。

          详细变更、适用范围和安装方法见 README；首次从旧调试签名版本迁移时需要卸载旧版。
        files: |
          ${{ github.workspace }}/app/build/outputs/apk/release/fcmfix-oneplus15-coloros16-${{ env.VERSION_NAME }}.apk
